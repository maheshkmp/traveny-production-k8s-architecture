apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: traveny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: api
        image: ghcr.io/maheshkmp/traveny/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: traveny-secrets
              key: database-url
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: traveny-secrets
              key: better-auth-secret
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: traveny-secrets
              key: resend-api-key
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        - name: BETTER_AUTH_BASE_URL
          value: "http://api-service:4000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: traveny
spec:
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
