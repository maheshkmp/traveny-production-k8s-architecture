name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Images are tagged as ghcr.io/maheshkmp/traveny/api and ghcr.io/maheshkmp/traveny/web
  IMAGE_PREFIX: ghcr.io/maheshkmp/traveny

jobs:
  # Job 1: Build images in CI and push to GHCR
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=https://traveny.com/api/auth
            NEXT_PUBLIC_API_URL=https://api.traveny.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Job 2: Deploy to AWS EC2 Kubernetes Cluster
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH to EC2 Kubernetes Node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Starting Kubernetes deployment..."

            # 1. Sync latest Kubernetes manifests
            if [ ! -d "$HOME/traveny" ]; then
              git clone https://github.com/maheshkmp/traveny.git $HOME/traveny
            fi
            cd $HOME/traveny
            git fetch origin main && git reset --hard origin/main

            # 2. Install cert-manager & apply all Kubernetes manifests
            echo "🔐 Ensuring cert-manager CRDs are installed..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
            kubectl rollout status deployment/cert-manager -n cert-manager --timeout=120s
            kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=120s
            kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s
            echo "⏳ Waiting 15 seconds for cert-manager webhook certificates to stabilize..."
            sleep 15

            # Apply ClusterIssuer with retry to prevent webhook certificate race condition
            for i in {1..5}; do
              kubectl apply -f k8s/cluster-issuer.yaml && break || sleep 5
            done
            kubectl apply -f k8s/db.yaml
            kubectl apply -f k8s/api.yaml
            kubectl apply -f k8s/web.yaml
            kubectl apply -f k8s/ingress.yaml

            # Wait for PostgreSQL Database to be ready
            echo "⏳ Waiting for PostgreSQL database to be ready..."
            kubectl rollout status deployment/db -n traveny --timeout=120s

            # 3. Run Database Migration Job
            echo "⏳ Running Database Migration Job..."
            kubectl delete job traveny-db-migrate -n traveny --ignore-not-found
            kubectl apply -f k8s/migration-job.yaml
            if ! kubectl wait --for=condition=complete job/traveny-db-migrate -n traveny --timeout=120s; then
              echo "❌ Migration Job failed or timed out. Fetching pod logs:"
              kubectl logs job/traveny-db-migrate -n traveny || true
              exit 1
            fi

            # 4. Rolling Update API & Web Deployments with new image tag
            echo "🔄 Updating deployments to image tag: ${{ github.sha }}"
            kubectl set image deployment/api api=${{ env.IMAGE_PREFIX }}/api:${{ github.sha }} -n traveny
            kubectl set image deployment/web web=${{ env.IMAGE_PREFIX }}/web:${{ github.sha }} -n traveny

            # 5. Wait for rollout completion
            kubectl rollout status deployment/api -n traveny --timeout=120s
            kubectl rollout status deployment/web -n traveny --timeout=120s

            echo "✅ Kubernetes deployment complete!"

      - name: Verify Kubernetes Deployment Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl get pods,svc,ingress -n traveny

